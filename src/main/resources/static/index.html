<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
    <div>
        <h1>URL Shortener</h1>
        <p>Create short links and track clicks.</p>
    </div>
</header>

<main>
    <section class="card create-card">
        <h2>Create Short URL</h2>
        <form id="urlForm">
            <input id="urlInput" type="url" placeholder="https://example.com/long-url" required>
            <button type="submit">Shorten URL</button>
        </form>
        <div id="result"></div>
    </section>

    <section class="stats">
        <div class="stat"><span>Total Links</span><strong id="totalLinks">0</strong></div>
        <div class="stat"><span>Total Clicks</span><strong id="totalClicks">0</strong></div>
        <div class="stat"><span>Active Links</span><strong id="activeLinks">0</strong></div>
    </section>

    <section class="card">
        <div class="section-title">
            <h2>Short Links</h2>
            <button class="secondary" onclick="loadUrls()">Refresh</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Original URL</th>
                        <th>Clicks</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="urlTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
